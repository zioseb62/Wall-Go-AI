<svg width="1024" height="500" viewBox="0 0 1024 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Sfondo Scurissimo con Gradiente -->
  <rect width="1024" height="500" fill="url(#bg_grad)"/>
  
  <!-- Griglia di Sfondo Cyberpunk -->
  <g opacity="0.1">
    <path d="M0 50H1024M0 100H1024M0 150H1024M0 200H1024M0 250H1024M0 300H1024M0 350H1024M0 400H1024M0 450H1024" stroke="#3B82F6" stroke-width="0.5"/>
    <path d="M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M600 0V500M700 0V500M800 0V500M900 0V500" stroke="#3B82F6" stroke-width="0.5"/>
  </g>

  <!-- Bagliori Laterali (Glow) -->
  <circle cx="0" cy="250" r="300" fill="url(#blue_glow)" opacity="0.4"/>
  <circle cx="1024" cy="250" r="300" fill="url(#emerald_glow)" opacity="0.3"/>

  <!-- Gruppo Logo (Sinistra) -->
  <g transform="translate(80, 100)">
    <!-- Effetto Ombra/Glow sotto il logo -->
    <rect x="0" y="0" width="200" height="200" rx="40" fill="#3B82F6" opacity="0.1">
      <animate attributeName="opacity" values="0.05;0.15;0.05" dur="4s" repeatCount="indefinite" />
    </rect>
    
    <!-- Logo SVG (Stessa logica di Logo.tsx) -->
    <g transform="scale(2)">
      <rect x="5" y="5" width="90" height="90" rx="20" fill="#0F172A" stroke="url(#logo_grad)" stroke-width="2"/>
      <g filter="url(#neon_glow)">
        <path d="M25 35V65L50 45L75 65V35" stroke="url(#logo_grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <circle cx="50" cy="45" r="7" fill="#EF4444"/>
    </g>
    
    <!-- Nome Gioco -->
    <text x="230" y="90" fill="white" font-family="Arial, sans-serif" font-weight="900" font-style="italic" font-size="72" letter-spacing="2">WALL GO <tspan fill="#3B82F6">AI</tspan></text>
    <text x="230" y="140" fill="#94A3B8" font-family="Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="4">NEON STRATEGY BATTLE</text>
  </g>

  <!-- Rappresentazione Tabellone (Destra in Prospettiva) -->
  <g transform="translate(650, 250) rotate(-15) skewX(10)">
    <!-- Base Tabellone -->
    <rect x="0" y="0" width="300" height="300" rx="20" fill="#0F172A" stroke="#1E293B" stroke-width="4" />
    <!-- Mura Esempio -->
    <path d="M42 0V300M84 0V300M126 0V300M168 0V300M210 0V300M252 0V300" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
    <path d="M0 42H300M0 84H300M0 126H300M0 168H300M0 210H300M0 252H300" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
    
    <!-- Mura Neon di Esempio -->
    <path d="M84 84V168" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
    <path d="M84 168H168" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
    <path d="M168 168V84" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
    
    <!-- Pedine di Esempio -->
    <circle cx="105" cy="105" r="10" fill="#3B82F6" />
    <circle cx="231" cy="231" r="10" fill="#EF4444" />
    <circle cx="63" cy="231" r="10" fill="#10B981" />
  </g>

  <!-- Badge Info Sotto -->
  <rect x="80" y="380" width="350" height="50" rx="25" fill="#1E293B" opacity="0.8" />
  <text x="105" y="412" fill="#34D399" font-family="Arial, sans-serif" font-weight="800" font-size="16">2-4 PLAYERS • ADAPTIVE AI • 100% OFFLINE</text>

  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    
    <linearGradient id="logo_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <radialGradient id="blue_glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 250) scale(300)">
      <stop stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emerald_glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1024 250) scale(300)">
      <stop stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <filter id="neon_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
</svg>