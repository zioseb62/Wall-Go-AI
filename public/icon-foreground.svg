
<svg width="108" height="108" viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Safe Zone Circle (72dp) - Content is centered inside -->
  <g filter="url(#glow)">
    <!-- Muro Sinistro Blue -->
    <path d="M34 38V70L54 52" stroke="#3B82F6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Muro Destro Emerald -->
    <path d="M54 52L74 70V38" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Pedina Centrale Red -->
  <circle cx="54" cy="52" r="8" fill="#EF4444"/>
  <circle cx="54" cy="52" r="8" fill="url(#inner_light)" fill-opacity="0.3"/>
  <circle cx="51" cy="49" r="2" fill="white" fill-opacity="0.5"/>

  <defs>
    <filter id="glow" x="20" y="20" width="68" height="68" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="inner_light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(51 49) rotate(45) scale(15)">
      <stop stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </radialGradient>
  </defs>
</svg>
