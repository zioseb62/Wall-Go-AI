<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Questo SVG non ha sfondo per garantire la trasparenza richiesta da Google -->
  <defs>
    <linearGradient id="pc-logo-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="pc-logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(300, 200)">
    <!-- Icona Minimalista sopra il testo -->
    <g transform="translate(0, -70) scale(0.7)" filter="url(#pc-logo-glow)">
      <path d="M-40 -30 L40 -30 L0 40 Z" fill="none" stroke="url(#pc-logo-grad)" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="0" cy="-5" r="10" fill="#EF4444"/>
    </g>

    <!-- Nome del Gioco -->
    <text text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="85" font-style="italic" filter="url(#pc-logo-glow)">
      WALL GO <tspan fill="url(#pc-logo-grad)">AI</tspan>
    </text>
    
    <!-- Tagline Strategica -->
    <text y="50" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-weight="700" font-size="20" letter-spacing="10" opacity="0.9">
      NEON STRATEGY BATTLE
    </text>
  </g>
</svg>