    <!-- Grid Cells -->
    <g opacity="0.6">
      <rect x="10" y="10" width="102" height="102" rx="10" fill="#0F172A" />
      <rect x="122" y="10" width="102" height="102" rx="10" fill="#0F172A" />
      <rect x="234" y="10" width="102" height="102" rx="10" fill="#0F172A" />
      <!-- (truncated for clarity, using visual pattern) -->
      <path d="M10 122H790M10 234H790M10 346H790M10 458H790M10 570H790M10 682H790" stroke="#FFFFFF" stroke-opacity="0.05"/>
