  <rect x="90" y="400" width="900" height="1300" rx="60" fill="#0F172A" stroke="#1E293B" stroke-width="10"/>
  
  <rect x="140" y="450" width="380" height="150" rx="30" fill="#1E293B" stroke="#3B82F6" stroke-width="3"/>
  <text x="170" y="500" fill="#3B82F6" font-family="sans-serif" font-weight="900" font-size="24">YOU</text>
  <text x="170" y="550" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="48">24 PTS</text>
  
  <rect x="560" y="450" width="380" height="150" rx="30" fill="#1E293B" opacity="0.5"/>
