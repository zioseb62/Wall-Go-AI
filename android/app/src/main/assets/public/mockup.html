<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup Griglia 2x4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-slate-900 p-4">
    <!-- Simula lo schermo di uno smartphone -->
    <div class="w-full max-w-[390px] h-[844px] bg-slate-950 border-[6px] border-slate-800 rounded-[3rem] p-4 relative overflow-hidden shadow-2xl flex flex-col">
        
        <!-- Intaglio / Dynamic Island finta -->
        <div class="w-32 h-6 bg-black absolute top-0 left-1/2 -translate-x-1/2 rounded-b-3xl z-10"></div>
        
        <!-- Header Mockup -->
        <div class="mt-8 mb-4 flex justify-between items-center px-2">
            <div class="text-xl font-black italic text-blue-400 flex items-center gap-2">
                <span class="text-2xl">🟦</span> WALL GO AI
            </div>
            <div class="flex gap-2">
                <div class="w-8 h-8 bg-slate-800 rounded-full flex items-center justify-center text-sm">❓</div>
                <div class="w-8 h-8 bg-slate-800 rounded-full flex items-center justify-center text-sm">👤</div>
            </div>
        </div>

        <div class="w-full py-3 bg-slate-900/50 rounded-[1.25rem] border border-blue-500/20 flex flex-col items-center justify-center mb-4 shrink-0">
            <span class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-1">SCORE GLOBALE</span>
            <span class="text-2xl font-black text-white">42.5</span>
        </div>

        <!-- Contenitore scrollabile -->
        <div class="flex-1 overflow-y-auto pr-1 pb-4">
            
            <!-- Etichetta -->
            <div class="flex items-center justify-between mb-3 px-1">
                <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Modalità di Gioco</h3>
                <span class="text-[10px] font-bold text-slate-600">8 Giochi</span>
            </div>

            <!-- GRIGLIA 2x4 -->
            <div class="grid grid-cols-2 gap-3 mb-6">
                
                <!-- Tile 1 (Selezionata) -->
                <div class="bg-blue-600/20 border-2 border-blue-500 rounded-[1.25rem] p-4 flex flex-col items-center justify-center aspect-square shadow-lg shadow-blue-900/50 relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-t from-blue-500/20 to-transparent"></div>
                    <div class="text-3xl mb-2 relative z-10">🟦</div>
                    <span class="text-xs font-black uppercase tracking-widest text-blue-400 text-center relative z-10 line-clamp-1">Wall Go AI</span>
                    <span class="text-[8px] text-blue-300/80 mt-1 uppercase relative z-10">Cattura Terr.</span>
                </div>
                
                <!-- Tile 2 -->
                <div class="bg-slate-800/50 border border-white/5 rounded-[1.25rem] p-4 flex flex-col items-center justify-center aspect-square opacity-70">
                    <div class="text-3xl mb-2">🏁</div>
                    <span class="text-xs font-black uppercase tracking-widest text-slate-400 text-center line-clamp-1">Quoridor</span>
                </div>
                
                <!-- Tile 3 -->
                <div class="bg-slate-800/50 border border-white/5 rounded-[1.25rem] p-4 flex flex-col items-center justify-center aspect-square opacity-70">
                    <div class="text-3xl mb-2">🏹</div>
                    <span class="text-xs font-black uppercase tracking-widest text-slate-400 text-center line-clamp-1">Amazons</span>
                </div>
                
                <!-- Tile 4 -->
                <div class="bg-slate-800/50 border border-white/5 rounded-[1.25rem] p-4 flex flex-col items-center justify-center aspect-square opacity-70">
                    <div class="text-3xl mb-2">⚔️</div>
                    <span class="text-xs font-black uppercase tracking-widest text-slate-400 text-center line-clamp-1">Domineering</span>
                </div>
                
                <!-- Tile 5 -->
                <div class="bg-slate-800/50 border border-white/5 rounded-[1.25rem] p-4 flex flex-col items-center justify-center aspect-square opacity-70">
                    <div class="text-3xl mb-2">🎱</div>
                    <span class="text-xs font-black uppercase tracking-widest text-slate-400 text-center line-clamp-1">Abalone</span>
                </div>
                
                <!-- Tile 6 -->
                <div class="bg-slate-800/50 border border-white/5 rounded-[1.25rem] p-4 flex flex-col items-center justify-center aspect-square opacity-70">
                    <div class="text-3xl mb-2">⬡</div>
                    <span class="text-xs font-black uppercase tracking-widest text-slate-400 text-center line-clamp-1">Hex</span>
                </div>
                
                <!-- Tile 7 -->
                <div class="bg-slate-800/50 border border-white/5 rounded-[1.25rem] p-4 flex flex-col items-center justify-center aspect-square opacity-70">
                    <div class="text-3xl mb-2">🪐</div>
                    <span class="text-xs font-black uppercase tracking-widest text-slate-400 text-center line-clamp-1">Orbito</span>
                </div>
                
                <!-- Tile 8 (Nuova Pente) -->
                <div class="bg-slate-800/50 border border-purple-500/50 border-dashed rounded-[1.25rem] p-4 flex flex-col items-center justify-center aspect-square relative bg-purple-900/10">
                    <div class="absolute -top-2 -right-2 bg-gradient-to-r from-purple-500 to-pink-500 text-[8px] font-black px-2 py-0.5 rounded-full text-white shadow-lg">NOVITÀ</div>
                    <div class="text-3xl mb-2">⭐</div>
                    <span class="text-xs font-black uppercase tracking-widest text-purple-400 text-center line-clamp-1">Pente</span>
                </div>
                
            </div>
            
            <!-- Simulazione Bottoni Settings -->
            <div class="space-y-4 bg-slate-900/50 p-4 rounded-[1.5rem] border border-white/10 shadow-xl">
                <div class="space-y-1.5 flex flex-col">
                    <label class="text-[9px] font-black text-slate-500 uppercase px-1 tracking-widest text-emerald-400">Tema Scacchiera</label>
                    <div class="flex gap-2">
                        <div class="flex-1 py-3 mt-1 bg-slate-800/50 border border-white/10 rounded-xl text-center text-xs font-bold text-slate-400">Classico</div>
                        <div class="flex-1 py-3 mt-1 bg-blue-600/50 border border-blue-400 rounded-xl text-center text-xs font-bold text-white">Neon</div>
                    </div>
                </div>
            </div>
            
        </div>
        
        <!-- Fixed AVVIA PARTITA button al bottom -->
        <button class="w-full py-4 mt-2 bg-gradient-to-r from-blue-600 to-emerald-600 rounded-2xl font-black text-xl shadow-2xl shrink-0 uppercase tracking-widest">
            Avvia Battaglia
        </button>
    </div>
</body>
</html>
