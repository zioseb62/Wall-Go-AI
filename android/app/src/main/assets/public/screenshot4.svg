<svg width="1080" height="1920" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1920" fill="#020617"/>
  <circle cx="540" cy="960" r="600" fill="#F59E0B" opacity="0.2"/>
  
  <text x="50%" y="200" text-anchor="middle" fill="white" font-family="Arial" font-weight="900" font-size="80" font-style="italic">CLAIM VICTORY</text>
  <text x="50%" y="280" text-anchor="middle" fill="#F59E0B" font-family="Arial" font-weight="700" font-size="40" letter-spacing="5">COLLECT POINTS &amp; RANK UP</text>

  <g transform="translate(90, 400)">
    <rect width="900" height="1300" rx="60" fill="#0F172A" stroke="#1E293B" stroke-width="10" opacity="0.5"/>
    
    <!-- Victory Dialog Overlay -->
    <rect x="50" y="250" width="800" height="800" rx="60" fill="#1E293B" stroke="white" stroke-width="4"/>
    <text x="50%" y="450" text-anchor="middle" fill="white" font-family="Arial" font-weight="900" font-size="100">YOU WIN!</text>
    
    <circle cx="450" cy="650" r="120" fill="#020617" stroke="#3B82F6" stroke-width="5"/>
    <text x="450" y="680" text-anchor="middle" fill="white" font-family="Arial" font-weight="900" font-size="80">42</text>
    <text x="450" y="820" text-anchor="middle" fill="#94A3B8" font-family="Arial" font-weight="900" font-size="30">FINAL POINTS</text>
    
    <rect x="150" y="880" width="600" height="100" rx="30" fill="white"/>
    <text x="50%" y="945" text-anchor="middle" fill="#020617" font-family="Arial" font-weight="900" font-size="40">PLAY AGAIN</text>
    
    <!-- Confetti representation -->
    <path d="M100 300L120 320" stroke="#EF4444" stroke-width="10" stroke-linecap="round"/>
    <path d="M700 400L720 380" stroke="#3B82F6" stroke-width="10" stroke-linecap="round"/>
    <path d="M200 900L230 880" stroke="#10B981" stroke-width="10" stroke-linecap="round"/>
    <path d="M600 300L610 330" stroke="#F59E0B" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>